services:
  db:
    image: pgvector/pgvector:pg16
    container_name: tenderai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tenderai
      POSTGRES_USER: tenderai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tenderai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenderai -d tenderai"]
      interval: 5s
      timeout: 5s
      retries: 15
    mem_limit: 512m

  ollama:
    image: ollama/ollama:latest
    container_name: tenderai-ollama
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "2m"
    volumes:
      - tenderai_ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    mem_limit: 3200m

  ollama-init:
    image: ollama/ollama:latest
    container_name: tenderai-ollama-init
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["until ollama list >/dev/null 2>&1; do sleep 3; done; ollama pull qwen2.5:3b"]
    restart: "no"

  api:
    build:
      context: ./backend
    container_name: tenderai-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://tenderai:${POSTGRES_PASSWORD}@db:5432/tenderai
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
      STORAGE_DIR: /app/storage
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    volumes:
      - tenderai_uploads:/app/storage
      - tenderai_hf_cache:/root/.cache/huggingface
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    mem_limit: 1500m

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: tenderai-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api
    mem_limit: 512m

volumes:
  tenderai_pgdata:
  tenderai_ollama:
  tenderai_uploads:
  tenderai_hf_cache:
